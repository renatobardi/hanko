<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Envio · Hanko</title>
<link rel="stylesheet" href="/static/send.css">
<script type="module" src="/static/send.js"></script>
</head>
<body>
<main class="send">
  <h1>Envio protegido</h1>
  <p id="status" role="status">Carregando…</p>
  <form id="password-form" hidden>
    <label for="password">Senha do envio</label>
    <input id="password" name="password" type="password" autocomplete="off" required>
    <button type="submit">Abrir</button>
  </form>
  <section id="result" hidden>
    <pre id="content"></pre>
  </section>
  <p class="note">A chave deste envio está no endereço depois do #. Ela não sai do seu navegador. O conteúdo some do servidor ao vencer o prazo ou o limite de acessos.</p>
</main>
</body>
</html>
