# e2e: jornadas críticas no navegador (Playwright) contra Postgres real e o adapter fake (ADR-0058 §D, item #57).
# Fica fora do `ci` para o PR continuar rápido. Roda no PR que toca UI, handlers, migrations ou o próprio e2e, e no main.
# O harness (e2e/harness/global-setup.ts) zera o schema do banco, sobe `bin/hanko serve` e lê o link de claim do stderr.
name: e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "internal/ui/**"
      - "internal/api/**"
      - "internal/app/**"
      - "internal/auth/**"
      - "internal/ratelimit/**"
      - "internal/telemetry/**"
      - "internal/service/**"
      - "db/**"
      - "e2e/**"
      - "ui/islands/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04 # o Playwright ainda não suporta chromium no ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hanko_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HANKO_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hanko_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: instalar templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070
      - name: build
        run: make build VERSION=e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # só ferramenta de teste; o binário não depende de Node
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: dependências do e2e
        working-directory: e2e
        run: npm ci
      - name: Chromium do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: jornadas
        working-directory: e2e
        run: npx playwright test
      - name: log do servidor (em falha)
        if: failure()
        run: tail -n 200 e2e/.run/hanko.log || true
      - name: relatório do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-relatorio
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.run/hanko.log
          if-no-files-found: ignore
          retention-days: 14
