# e2e: jornadas críticas no navegador (Playwright) contra Postgres real e harness fake.
# ESQUELETO: o conteúdo entra na onda 1 com o item #57 (docs/ROADMAP.md). Fica fora do ci para o PR continuar rápido;
# quando preenchido, roda no PR que toca UI/handlers e no main. Hoje só valida que o workflow carrega.
name: e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: pendente (#57)
        run: |
          echo "e2e ainda sem jornadas; preenchido na onda 1 (item #57)."
      # Roteiro do #57, para quando entrar:
      #   - services: postgres:17 (como no ci.yml) e HANKO_TEST_DATABASE_URL
      #   - make build; hanko serve com harness fake em background
      #   - npx playwright install --with-deps chromium; npx playwright test (~15 jornadas)
      #   - screenshot diff das telas principais; upload do relatório em caso de falha
