# security: vulnerabilidades de dependências e do sistema de arquivos. Separado do ci para não travar o PR
# por causa de um CVE novo publicado hoje; roda no PR, no main e toda semana. O dependabot (.github/dependabot.yml)
# abre os PRs de atualização.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # segunda, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  trivy-fs:
    runs-on: ubuntu-26.04
    # O instalador do binário do trivy falhou no runner (install.sh sai com 1 antes de varrer). Até estabilizar,
    # o job não bloqueia o PR; depois de uma execução que realmente varra, remova continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: trivy fs (dependências e segredos)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    # só no PR: compara as dependências do PR com a base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Exige Dependency graph + GitHub Advanced Security no repositório (Settings > Code security).
    # Enquanto isso não estiver ligado o job não bloqueia o PR; depois de ligar, remova continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
