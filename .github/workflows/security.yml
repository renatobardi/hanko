# security: vulnerabilidades de dependências e do sistema de arquivos. Separado do ci para não travar o PR
# por causa de um CVE novo publicado hoje; roda no PR, no main e toda semana. O dependabot (.github/dependabot.yml)
# abre os PRs de atualização.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # segunda, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gitleaks:
    # segredos no histórico inteiro (o repo é público; issue #23). Falsos positivos conhecidos em .gitleaks.toml.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          "$(go env GOPATH)/bin/gitleaks" detect --redact --no-banner -v

  trivy-fs:
    runs-on: ubuntu-26.04
    # O instalador do binário do trivy falhou no runner (install.sh sai com 1 antes de varrer). Até estabilizar,
    # o job não bloqueia o PR; depois de uma execução que realmente varra, remova continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy fs (dependências e segredos)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    # só no PR: compara as dependências do PR com a base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Exige Dependency graph + GitHub Advanced Security no repositório (Settings > Code security).
    # Enquanto isso não estiver ligado o job não bloqueia o PR; depois de ligar, remova continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
