name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hanko_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HANKO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hanko_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: instalar templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070

      - name: fmt-check
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-mode: goinstall # compila com o Go 1.27 do setup-go (binário pré-compilado pode ser mais antigo que o go.mod)
      - name: test
        run: go test -race ./...
      - name: test (integration)
        run: go test -race -p 1 -tags integration ./... # pacotes em série: todos resetam o schema do mesmo banco
      - name: build
        run: make build VERSION=ci

      - name: openapi diff
        run: |
          bin/hanko openapi > "$RUNNER_TEMP/openapi.json"
          diff -u api/openapi.json "$RUNNER_TEMP/openapi.json"

      - name: templ generate diff
        run: |
          templ generate
          git diff --exit-code

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc diff
        run: sqlc diff
