# ci: o que roda em todo PR, rápido e determinístico. O que tem outro propósito mora em workflows próprios:
# e2e.yml (jornadas no navegador), evals.yml (comportamento das personas, nightly), security.yml (vulnerabilidades),
# edge.yml (canal edge), release.yml (tag v*). Os jobs `check` e `release-dry-run` são os status exigidos pelo repo:
# não renomear.
#
# Jobs em paralelo (#51): `estatico` (fmt, vet, lint), `gerados` (build e drift de openapi/templ/ilhas/sqlc) e `test`
# (matriz de shards, cada um com seu Postgres). O `check` agrega: só passa se todos passarem, confere que os shards
# cobriram todos os pacotes e aplica o piso de cobertura no perfil mesclado.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pacotes que rodam num shard próprio; o shard `resto` roda todos os outros. Um pacote novo cai no `resto`.
  TEST_ISOLADOS: ./internal/service

jobs:
  estatico:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: fmt-check
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: scripts (notas de release)
        run: scripts/test-release-notes.sh
      - name: scripts (install.sh)
        run: scripts/test-install.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          install-mode: goinstall # compila com o Go 1.27 do setup-go (binário pré-compilado pode ser mais antigo que o go.mod)
      - name: nenhum teste fora da tag integration
        # a rodada com -tags integration é a única (#51): ela só cobre todos os testes se nenhum arquivo excluir a tag
        run: |
          if grep -rlE --include='*_test.go' '^//go:build.*!integration' .; then
            echo "teste com //go:build !integration não roda no CI" >&2
            exit 1
          fi

  gerados:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: instalar templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1100
      - name: build
        run: make build VERSION=ci

      - name: openapi diff
        run: |
          bin/hanko openapi > "$RUNNER_TEMP/openapi.json"
          diff -u api/openapi.json "$RUNNER_TEMP/openapi.json"
          bin/hanko openapi --ingest > "$RUNNER_TEMP/openapi-ingest.json"
          diff -u api/openapi-ingest.json "$RUNNER_TEMP/openapi-ingest.json"

      - name: templ generate diff
        run: |
          templ generate -path internal/ui/views   # mesmo caminho do código versionado (FileName relativo)
          git diff --exit-code

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # só ferramenta de build das ilhas (ADR-0005/0026); o binário não depende de Node
          cache: npm
          cache-dependency-path: ui/islands/package-lock.json
      - name: ilhas (npm ci, typecheck, testes, build)
        working-directory: ui/islands
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run smoke # monta o bundle minificado num DOM (jsdom)
      - name: ilhas build diff
        # o bundle versionado tem que ser exatamente o que o código-fonte gera (inclusive arquivos novos/removidos)
        run: |
          git diff --exit-code -- internal/ui/static/islands
          test -z "$(git status --porcelain -- internal/ui/static/islands)"

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      - name: sqlc diff
        run: sqlc diff

  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false # um shard vermelho não cancela o outro: o PR mostra todas as falhas de uma vez
      matrix:
        shard: [service, resto]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hanko_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HANKO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hanko_test?sslmode=disable
      SHARD: ${{ matrix.shard }}
      # com -race, todo binário de teste (e todo subprocesso que reexecuta o binário) espera 1 s ao sair, por padrão.
      # Com os pacotes em série, isso soma ~1 min por shard (#75).
      GORACE: atexit_sleep_ms=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: cache do build dos testes
        # o cache do setup-go é salvo uma vez por go.sum e não tem o build com -race. Este guarda o do shard: a main
        # salva a cada push (passo no fim do job), e PRs e a main restauram o mais recente (#75).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-
      - name: cliente Postgres 17 (pg_dump/pg_restore do teste de restore)
        run: sudo apt-get install -y postgresql-client-17 || echo "sem postgresql-client-17; o teste de restore vai pular"
      - name: pacotes do shard
        run: |
          # shellcheck disable=SC2086 # TEST_ISOLADOS é uma lista separada por espaço
          isolados=$(go list -tags integration $TEST_ISOLADOS)
          if [ "$SHARD" = resto ]; then
            go list -tags integration ./... | grep -vxF "$isolados" > "pacotes-$SHARD.txt"
          else
            go list -tags integration "./internal/$SHARD" > "pacotes-$SHARD.txt"
          fi
          wc -l < "pacotes-$SHARD.txt"
      - name: compila os testes (em paralelo)
        # o -p 1 do passo seguinte também serializa a compilação, e o cache do setup-go não guarda o build com -race.
        # Aqui a compilação usa todos os núcleos e o passo seguinte só reaproveita o cache (#75). Mesmas flags de build;
        # -run '^$' não roda teste nenhum, e sem a URL nenhum teste toca o banco.
        env:
          HANKO_TEST_DATABASE_URL: ""
        run: |
          # shellcheck disable=SC2046 # um argumento por pacote
          go test -race -tags integration -covermode=atomic -coverprofile="$RUNNER_TEMP/aquece.out" -run '^$' \
            $(cat "pacotes-$SHARD.txt") > /dev/null
      - name: test (unit + integration + cobertura)
        # uma rodada só: -tags integration roda também os testes sem tag (#51).
        # pacotes em série (-p 1): todos resetam o schema do mesmo banco; em paralelo (runners de 4 vCPU) eles se atropelam.
        # Cada shard tem o próprio Postgres, então os shards não se atropelam entre si.
        # O pacote service passa de 10 min com -race (timeout padrão do go test). O perfil alimenta o piso de cobertura (#56).
        run: |
          # shellcheck disable=SC2046 # um argumento por pacote
          go test -race -p 1 -timeout 30m -tags integration -covermode=atomic -coverprofile="cover-$SHARD.out" \
            $(cat "pacotes-$SHARD.txt")
      - name: salva o cache do build dos testes
        # só a main salva: PRs leem o cache da main, e uma entrada por PR encheria o limite de cache do repositório
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.shard }}
          path: |
            cover-${{ matrix.shard }}.out
            pacotes-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 1

  check:
    # status exigido pela main. if: always() é obrigatório: sem ele, um job de `needs` vermelho deixaria o check
    # "skipped", e o GitHub conta check obrigatório skipped como aprovado.
    if: always()
    needs: [estatico, gerados, test]
    runs-on: ubuntu-26.04
    steps:
      - name: jobs anteriores
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: shards cobrem todos os pacotes
        run: |
          go list -tags integration ./... | sort > "$RUNNER_TEMP/todos.txt"
          cat shards/pacotes-*.txt | sort > "$RUNNER_TEMP/shards.txt"
          dup=$(uniq -d "$RUNNER_TEMP/shards.txt")
          if [ -n "$dup" ]; then echo "pacote em mais de um shard:" >&2; echo "$dup" >&2; exit 1; fi
          diff -u "$RUNNER_TEMP/todos.txt" "$RUNNER_TEMP/shards.txt"
      - name: perfil de cobertura mesclado
        # cada pacote está num shard só, então concatenar os perfis dá a mesma cobertura por pacote de uma rodada única
        run: |
          for f in shards/cover-*.out; do
            [ "$(head -1 "$f")" = "mode: atomic" ] || { echo "perfil sem mode: atomic: $f" >&2; exit 1; }
          done
          { echo "mode: atomic"; for f in shards/cover-*.out; do tail -n +2 "$f"; done; } > cover.out
      - name: piso de cobertura
        run: scripts/coverage-gate.sh cover.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura
          path: cover.out
          if-no-files-found: ignore
          retention-days: 14

  release-dry-run:
    # valida a config do goreleaser e compila os binários de todas as plataformas sem publicar,
    # para a tag v* não ser o primeiro lugar onde a release quebra
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: build --snapshot --clean
