# Stack do Hanko: hanko + postgres 17 + ai-memory + otel-lgtm (+ caddy no profile "edge").
# Uso: cp .env.example .env && make up   (ou: docker compose -f deploy/compose.yaml --env-file .env up -d)
# Nada é publicado em 0.0.0.0 exceto o caddy (profile edge).
name: hanko

services:
  hanko:
    image: ghcr.io/renatobardi/hanko:${HANKO_VERSION:-dev}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${HANKO_VERSION:-dev}
    restart: unless-stopped
    environment:
      HANKO_DATABASE_URL: postgres://${POSTGRES_USER:-hanko}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hanko}?sslmode=disable
      HANKO_ADDR: 0.0.0.0:7420
      HANKO_PUBLIC_URL: ${HANKO_PUBLIC_URL:-http://hanko:7420}
      HANKO_MODE: ${HANKO_MODE:-authenticated}
      # Hosts aceitos no cabeçalho Host (anti DNS rebinding), além de localhost e do host de HANKO_PUBLIC_URL.
      HANKO_ALLOWED_HOSTS: ${HANKO_ALLOWED_HOSTS:-hanko,${HANKO_DOMAIN:-hanko.oute.pro}}
      HANKO_WORKSPACES_ROOT: ${HANKO_WORKSPACES_ROOT:-}
      HANKO_AGENT_ENV_ALLOW: ${HANKO_AGENT_ENV_ALLOW:-}
      HANKO_SECRET: ${HANKO_SECRET:-}
      # Lote v0.2: tudo opcional e desligado por padrão (ver docs/RUNBOOK.md)
      HANKO_SECRET_KEY: ${HANKO_SECRET_KEY:-}
      HANKO_SECRET_KEY_PREVIOUS: ${HANKO_SECRET_KEY_PREVIOUS:-}
      HANKO_ACP_ALLOW: ${HANKO_ACP_ALLOW:-}
      HANKO_ACP_COMMANDS: ${HANKO_ACP_COMMANDS:-}
      HANKO_INTEGRATIONS_ALLOW_STDIO: ${HANKO_INTEGRATIONS_ALLOW_STDIO:-}
      HANKO_INTEGRATIONS_ALLOW_PRIVATE: ${HANKO_INTEGRATIONS_ALLOW_PRIVATE:-}
      HANKO_MEMORY_READ_TOOL: ${HANKO_MEMORY_READ_TOOL:-}
      HANKO_ARTIFACT_MAX_BYTES: ${HANKO_ARTIFACT_MAX_BYTES:-}
      HANKO_ARTIFACT_QUOTA_BYTES: ${HANKO_ARTIFACT_QUOTA_BYTES:-}
      # M7: conteúdo de artefatos (ADR-0033) e cofre externo de segredos (ADR-0032). Tudo opcional; vazio = postgres e sem cofre.
      HANKO_BLOB_DRIVER: ${HANKO_BLOB_DRIVER:-}
      HANKO_S3_ENDPOINT: ${HANKO_S3_ENDPOINT:-}
      HANKO_S3_REGION: ${HANKO_S3_REGION:-}
      HANKO_S3_BUCKET: ${HANKO_S3_BUCKET:-}
      HANKO_S3_PREFIX: ${HANKO_S3_PREFIX:-}
      HANKO_S3_PATH_STYLE: ${HANKO_S3_PATH_STYLE:-}
      HANKO_S3_ACCESS_KEY: ${HANKO_S3_ACCESS_KEY:-}
      HANKO_S3_SECRET_KEY: ${HANKO_S3_SECRET_KEY:-}
      HANKO_VAULT_ADDR: ${HANKO_VAULT_ADDR:-}
      HANKO_VAULT_MOUNT: ${HANKO_VAULT_MOUNT:-}
      HANKO_VAULT_NAMESPACE: ${HANKO_VAULT_NAMESPACE:-}
      HANKO_VAULT_TOKEN: ${HANKO_VAULT_TOKEN:-}
      # Modo authenticated (docs/RUNBOOK.md §5).
      HANKO_AUTH_PROVIDER: ${HANKO_AUTH_PROVIDER:-local}
      HANKO_AUTH_ALLOWED_EMAILS: ${HANKO_AUTH_ALLOWED_EMAILS:-}
      HANKO_AUTH_ALLOWED_DOMAINS: ${HANKO_AUTH_ALLOWED_DOMAINS:-}
      # provider firebase em URL pública: lista de admissão acima OU dono nomeado (senão o boot é recusado).
      HANKO_AUTH_OWNER_EMAIL: ${HANKO_AUTH_OWNER_EMAIL:-}
      # provider local: libera o formulário web "Criar conta de dono" em URL pública (padrão: use `hanko auth create-owner`).
      HANKO_AUTH_WEB_BOOTSTRAP: ${HANKO_AUTH_WEB_BOOTSTRAP:-}
      # Pares cujo X-Forwarded-For vale (CIDRs). Vazio = padrão do Hanko (só 127.0.0.1/::1). O Caddy da borda fala
      # com o hanko pela rede docker: inclua a sub-rede do compose (docker network inspect <projeto>_hanko),
      # senão o rate limit de login enxerga o IP do Caddy em vez do cliente.
      HANKO_TRUSTED_PROXIES: ${HANKO_TRUSTED_PROXIES:-}
      HANKO_FIREBASE_PROJECT_ID: ${HANKO_FIREBASE_PROJECT_ID:-}
      HANKO_FIREBASE_API_KEY: ${HANKO_FIREBASE_API_KEY:-}
      HANKO_FIREBASE_AUTH_DOMAIN: ${HANKO_FIREBASE_AUTH_DOMAIN:-}
      HANKO_MEMORY_PROVIDER: ${HANKO_MEMORY_PROVIDER:-ai-memory}
      HANKO_MEMORY_URL: http://ai-memory:49374
      HANKO_MEMORY_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-}
      HANKO_LOG_LEVEL: ${HANKO_LOG_LEVEL:-info}
      HANKO_LOG_FORMAT: ${HANKO_LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
    ports:
      - "127.0.0.1:7420:7420"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hanko]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hanko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hanko]

  # Memória entre sessões (ADR-0015). Imagem fixada por digest em AI_MEMORY_IMAGE.
  ai-memory:
    image: ${AI_MEMORY_IMAGE:?defina AI_MEMORY_IMAGE com o digest fixado (akitaonrails/ai-memory@sha256:...)}
    restart: unless-stopped
    environment:
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-}
    volumes:
      - aimemory:/data
    ports:
      - "127.0.0.1:49374:49374"
    networks: [hanko]

  # Collector + Tempo + Loki + Mimir + Grafana em um container (ADR-0013).
  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE:-grafana/otel-lgtm:latest}
    restart: unless-stopped
    volumes:
      - lgtm:/data
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
    networks: [hanko]

  caddy:
    image: caddy:2
    profiles: [edge]
    restart: unless-stopped
    environment:
      HANKO_DOMAIN: ${HANKO_DOMAIN:-hanko.oute.pro}
      # basic_auth da borda no modo trusted (Caddyfile); no authenticated (Caddyfile.authenticated) não se usa.
      HANKO_EDGE_USER: ${HANKO_EDGE_USER:-}
      HANKO_EDGE_PASSWORD_HASH: ${HANKO_EDGE_PASSWORD_HASH:-}
    volumes:
      - ./caddy/${HANKO_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on: [hanko]
    networks: [hanko]

networks:
  hanko:

volumes:
  pgdata:
  aimemory:
  lgtm:
  caddy_data:
  caddy_config:
