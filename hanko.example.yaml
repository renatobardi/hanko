# Copie para hanko.yaml. Variáveis HANKO_* sobrescrevem estes valores.
database_url: postgres://hanko:hanko@127.0.0.1:5432/hanko?sslmode=disable
addr: 127.0.0.1:7420
# public_url: http://127.0.0.1:7420
mode: trusted            # trusted | authenticated (login; exige secret >= 32 bytes e public_url https)
# secret: ""             # prefira HANKO_SECRET (mínimo 32 bytes); vazio = gerado por boot
# allowed_hosts: []      # hosts extras aceitos no cabeçalho Host (HANKO_ALLOWED_HOSTS)
# workspaces_root: ""    # raiz dos workspaces (HANKO_WORKSPACES_ROOT); padrão $HOME/hanko-workspaces
# secret_key: ""        # cifra os segredos das integrações em repouso (HANKO_SECRET_KEY, mínimo 32 bytes; ADR-0029)
# secret_key_previous: "" # chave antiga durante a rotação (HANKO_SECRET_KEY_PREVIOUS)
# integrations:
#   allow_stdio: false              # libera MCP stdio (executa comando no servidor); HANKO_INTEGRATIONS_ALLOW_STDIO
#   allow_private_destinations: false # libera webhooks para loopback/redes privadas; HANKO_INTEGRATIONS_ALLOW_PRIVATE
# acp:
#   allow: false          # liga o harness acp (executa o comando da persona no servidor); HANKO_ACP_ALLOW
#   commands: []          # opcional: só estes executáveis (nome ou caminho absoluto); HANKO_ACP_COMMANDS
# agent_env_allow: []    # env extra do servidor repassado aos agentes (HANKO_AGENT_ENV_ALLOW)
# auth:                  # só vale com mode: authenticated (docs/RUNBOOK.md §5)
#   provider: firebase   # local | firebase
#   firebase:            # provider firebase: valores públicos do app Web (sem Admin SDK)
#     project_id: oute-sso
#     api_key: AIzaSyCh2NEff6X4ylSY1jtiFvuNe3fESMKZ5VE   # pública
#     auth_domain: oute-sso.firebaseapp.com
#   allowed_emails: []   # e/ou allowed_domains; sem listas só o primeiro usuário (dono) entra
#   allowed_domains: []
#   owner_email: renatobardicabral@gmail.com   # firebase: único e-mail que vira dono (obrigatório em public_url público sem listas)
#   web_bootstrap: false # local: libera o formulário "Criar conta de dono" em public_url público
# trusted_proxies: [127.0.0.1/32, ::1/128]   # CIDRs cujo X-Forwarded-For vale (HANKO_TRUSTED_PROXIES)
migrate_on_boot: true
memory:
  provider: ai-memory    # ai-memory | none
  url: http://127.0.0.1:49374
  # token: ""            # prefira HANKO_MEMORY_TOKEN
  # read_tool: ""        # tool de leitura de página, para o diff das propostas de curadoria (HANKO_MEMORY_READ_TOOL)
claude_bin: claude
codex_bin: codex
workers: 4
run_timeout: 30m
heartbeat_interval: 1m
artifact_max_bytes: 5242880      # tamanho máximo de um artefato, de 1 a 16777216 (HANKO_ARTIFACT_MAX_BYTES)
artifact_quota_bytes: 536870912  # cota de artefatos por empresa, todas as versões somadas (HANKO_ARTIFACT_QUOTA_BYTES)
alert_silent_factor: 3      # alerta "persona sem heartbeat" além de N× o intervalo dela (HANKO_ALERT_SILENT_FACTOR)
alert_run_stuck_after: 15m  # alerta "execução presa": running sem eventos há mais que isto (HANKO_ALERT_RUN_STUCK_AFTER)
log_level: info
log_format: json
