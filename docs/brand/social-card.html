<!doctype html>
<!-- Card de prévia social do repositório (1280×640). Fonte do PNG gerado por
     scripts/gen-social-card.mjs. Parâmetros: ?theme=dark · ?lang=pt · ?guides=1
     (mostra a margem de segurança de 80px, onde nada importante pode ficar). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hanko social card</title>
<style>
  @font-face {
    font-family: "Inter Variable";
    font-weight: 100 900;
    src: url("../../internal/ui/static/fonts/inter-latin-wght-normal.woff2") format("woff2");
  }
  /* Tokens do Kubo DS (mesmos valores de internal/ui/static/hanko.css). */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.147 0.004 49.25);
    --card: oklch(1 0 0);
    --muted: oklch(0.97 0.001 106.424);
    --muted-foreground: oklch(0.553 0.013 58.071);
    --border: oklch(0.923 0.003 48.717);
    --sakura-petal: #f4c9d4;
    --sakura-ink: var(--foreground);
    --radius: 0.5rem;
    --radius-3xl: calc(var(--radius) * 2.2);
    --radius-4xl: calc(var(--radius) * 2.6);
    --card-ring: 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent);
    --tracking-tight: -0.025em;
    --font-sans: "Inter Variable", "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-cjk: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "Noto Sans CJK JP", "WenQuanYi Zen Hei", serif;
    --guide: oklch(0.577 0.245 27.325);
  }
  :root[data-theme="dark"] {
    --background: oklch(0.147 0.004 49.25);
    --foreground: oklch(0.985 0.001 106.423);
    --card: oklch(0.216 0.006 56.043);
    --muted: oklch(0.268 0.007 34.298);
    --muted-foreground: oklch(0.709 0.01 56.259);
    --border: oklch(1 0 0 / 10%);
    --sakura-petal: transparent;
    --sakura-ink: #f4c9d4;
    --guide: oklch(0.704 0.191 22.216);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background: var(--muted);
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: absolute; inset: 40px;
    background: var(--card);
    border-radius: var(--radius-4xl);
    box-shadow: var(--card-ring);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
    padding: 40px 80px;
    text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 124px; height: 124px; }
  .sk-petal { fill: var(--sakura-petal); stroke: var(--sakura-ink); }
  .sk-stroke { stroke: var(--sakura-ink); }
  .sk-ink { fill: var(--sakura-ink); }
  .wordmark { display: flex; align-items: baseline; gap: 18px; }
  .wordmark b { font-size: 112px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; }
  .wordmark span { font-family: var(--font-cjk); font-size: 52px; color: var(--muted-foreground); line-height: 1; }
  h1 { font-size: 52px; font-weight: 600; letter-spacing: var(--tracking-tight); line-height: 1.15; }
  p { text-wrap: balance; font-size: 27px; line-height: 1.45; color: var(--muted-foreground); max-width: 920px; }
  .tags { display: flex; gap: 10px; }
  .tags span {
    font-size: 19px; font-weight: 500; padding: 7px 18px;
    border-radius: 9999px; box-shadow: var(--card-ring); color: var(--foreground);
  }
  .guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  .guides i { position: absolute; background: var(--guide); }
  .guides::before {
    content: ""; position: absolute; inset: 0;
    border: 80px solid color-mix(in oklab, var(--guide) 10%, transparent);
  }
  [data-guides] .guides { display: block; }
</style>
</head>
<body>
  <main class="frame">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <g stroke-width="6" stroke-linejoin="round">
          <path class="sk-petal" id="p" d="M50,50 C38,43 33,27 39,15 C42,8 47,10 50,17 C53,10 58,8 61,15 C67,27 62,43 50,50 Z"/>
          <use href="#p" transform="rotate(72 50 50)"/>
          <use href="#p" transform="rotate(144 50 50)"/>
          <use href="#p" transform="rotate(216 50 50)"/>
          <use href="#p" transform="rotate(288 50 50)"/>
        </g>
        <g id="st">
          <line class="sk-stroke" x1="50" y1="50" x2="50" y2="34" stroke-width="3.3" stroke-linecap="round" transform="rotate(36 50 50)"/>
          <circle class="sk-ink" cx="50" cy="33" r="3" transform="rotate(36 50 50)"/>
        </g>
        <use href="#st" transform="rotate(72 50 50)"/>
        <use href="#st" transform="rotate(144 50 50)"/>
        <use href="#st" transform="rotate(216 50 50)"/>
        <use href="#st" transform="rotate(288 50 50)"/>
        <circle class="sk-ink" cx="50" cy="50" r="5.4"/>
      </svg>
      <div class="wordmark"><b>Hanko</b><span lang="ja">判子</span></div>
    </div>
    <h1 data-i18n="title">Control plane for teams of AI agents</h1>
    <p data-i18n="desc">Tasks, an org chart, human approval gates and budgets that actually stop spending.</p>
    <div class="tags">
      <span data-i18n="bin">Single Go binary</span><span>PostgreSQL</span><span>OpenTelemetry</span><span>Open source</span>
    </div>
  </main>
  <div class="guides"><i style="left:80px;top:0;bottom:0;width:2px"></i><i style="right:80px;top:0;bottom:0;width:2px"></i><i style="top:80px;left:0;right:0;height:2px"></i><i style="bottom:80px;left:0;right:0;height:2px"></i></div>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (q.get("theme") === "dark") root.dataset.theme = "dark";
  if (q.get("guides")) root.dataset.guides = "";
  if (q.get("lang") === "pt") {
    root.lang = "pt-BR";
    const pt = {
      title: "Plano de controle para agentes de IA",
      desc: "Tasks, organograma, gates de aprovação humana e orçamentos que de fato param o gasto.",
      bin: "Um binário Go",
    };
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = pt[el.dataset.i18n]; });
    document.querySelector(".tags span:last-child").textContent = "Código aberto";
  }
</script>
</body>
</html>
